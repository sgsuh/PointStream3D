# Publish the demo site to GitHub Pages.
#
# The site is a project site, so it is served from /<repo>/ — the build needs
# that as its base, and the Service Worker's scope follows from it (the worker is
# addressed relative to its own registration scope, so nothing else needs to
# know). The published site ships no COPC samples; the demo streams one from a
# CORS-enabled public bucket instead.
#
# Requires: Settings -> Pages -> Source = "GitHub Actions".
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build demo site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
