<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PointStream3D — COPC → 3D Tiles (Service Worker)</title>
    <style>
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #status {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(11, 16, 33, 0.85);
        color: #cfe3ff;
        font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
        padding: 8px 12px;
        border-radius: 6px;
        max-width: 72vw;
      }
      #colorModes {
        position: absolute;
        top: 52px;
        left: 10px;
        z-index: 10;
        display: flex;
        gap: 6px;
      }
      #colorModes button {
        background: rgba(11, 16, 33, 0.85);
        color: #cfe3ff;
        border: 1px solid #2b3a5c;
        border-radius: 6px;
        padding: 5px 10px;
        font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
        cursor: pointer;
      }
      #colorModes button:hover {
        border-color: #4d6da3;
      }
      #colorModes button.active {
        background: #2f6fd0;
        color: #fff;
        border-color: #2f6fd0;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="status">PointStream3D (3D Tiles) — booting…</div>
    <div id="colorModes"></div>
    <script type="module" src="/src/tiles-main.ts"></script>
  </body>
</html>
